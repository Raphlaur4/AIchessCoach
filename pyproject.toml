[project]
name = "aichesscoach"
version = "0.1.0"
description = "Chess Coach Agent — identifies and explains key moments of a chess game in natural language."
readme = "README.md"
requires-python = ">=3.11"
authors = [
    { name = "Raphael Laurent" },
]
keywords = ["chess", "ai", "agent", "claude", "mcp", "stockfish"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Games/Entertainment :: Board Games",
]
dependencies = [
    "chess>=1.11.2",
    "mcp>=1.27.0",
]

[project.urls]
Repository = "https://github.com/Raphlaur4/AIchessCoach"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/aichesscoach"]

[dependency-groups]
dev = [
    "pytest>=9.0.3",
    "pytest-asyncio>=1.3.0",
    "pyyaml>=6.0.3",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
